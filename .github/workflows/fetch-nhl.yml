name: Fetch NHL Data

on:
  schedule:
    - cron: '0 19 * * *'  # 3pm ET daily — lines are usually confirmed by then
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests beautifulsoup4 tzdata

      - name: Run scraper and push to Gist
        env:
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.NHL_GIST_ID }}
        run: python scraper.py
